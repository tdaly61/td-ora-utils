# ARCHIVED — not wired to any script in this repo. See ./README.md in this
# directory before using it.
#
# Two-container alternative to the single adb-free container that
# run-adb-26ai.sh actually starts: a plain Oracle Database Free image plus a
# separate ORDS container that auto-installs APEX. Variables below are NOT
# populated by adb/.env as currently generated — see the README for what you'd
# need to supply (DB_HOSTNAME, ORACLE_PWD, DB_DATA_DIR, APEX_DIR, SERVICE_NAME).

services:
  oracle-db:
    image: ${DOCKER_IMAGE:-container-registry.oracle.com/database/free:latest}
    container_name: ${CONTAINER_NAME:-oracle-db}
    hostname: ${DB_HOSTNAME:-fu8.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - ${DB_DATA_DIR:-/home/ubuntu/db_data_dir}:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 150

  ords:
    image: container-registry.oracle.com/database/ords:latest
    container_name: ords
    environment:
      - DBHOST=oracle-db          # service name — docker compose DNS, not container_name
      - DBPORT=1521
      - DBSERVICENAME=${SERVICE_NAME:-FREEPDB1}
      - ORACLE_PWD=${ORACLE_PWD}  # used by ORDS to install itself as SYS
      - APEX_PWD=${ORACLE_PWD}    # password for APEX_PUBLIC_USER (required to complete ORDS setup)
    ports:
      - "${APEX_PORT:-8080}:8080"
    volumes:
      - ./ords_config:/etc/ords/config   # persists ORDS config across restarts
      - ${APEX_DIR}:/opt/oracle/apex          # ORDS auto-installs APEX from here on first run
    depends_on:
      oracle-db:
        condition: service_healthy
