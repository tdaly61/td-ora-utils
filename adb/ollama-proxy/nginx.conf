server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/proxy.crt;
    ssl_certificate_key /etc/nginx/certs/proxy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Increase timeouts — LLM inference can take 30–120s
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://host.docker.internal:11434;
        proxy_set_header Host              "localhost";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Disable buffering for streaming LLM responses
        proxy_buffering           off;
        chunked_transfer_encoding on;
    }
}
