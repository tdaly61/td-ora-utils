# Two-container topology: plain Oracle Database Free (see
# .env.sample/DOCKER_IMAGE_ARM/DOCKER_IMAGE_AMD) plus a separate ORDS
# container that auto-installs APEX from a locally-downloaded zip on first
# boot. Revived and updated from
# adb/legacy/compose-fullstack/docker-compose.yml — see dbfree/README.md for
# how this differs from the single-container adb-free setup in adb/.

services:
  oracle-db:
    # Official Oracle Database Free image — OTN registry login required (see
    # .env.sample: ORACLE_REGISTRY_USER/PASSWORD, accept the licence for
    # Database -> Free at https://container-registry.oracle.com before first
    # pull). DOCKER_IMAGE is resolved by select_docker_image() in
    # setup-for-dbfree.sh/run-dbfree.sh (arch-aware: DOCKER_IMAGE_ARM on
    # arm64, DOCKER_IMAGE_AMD on x86_64) and exported before this file is
    # read — the fallback below only applies if invoked some other way.
    # Default PDB name is FREEPDB1 (see .env.sample/ORACLE_PDB) — this would
    # be ORCLPDB1 instead if DOCKER_IMAGE were pointed at Enterprise Edition,
    # which also works with this same compose file but loses Free's
    # DBA-adjustable pga_aggregate_limit (see .env.sample/DOCKER_IMAGE_ARM).
    image: ${DOCKER_IMAGE:-container-registry.oracle.com/database/free:23.26.3.0-arm64}
    container_name: ${CONTAINER_NAME:-caseweave-dbfree-db}
    hostname: ${DB_HOSTNAME:-dbfree.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
    ports:
      # Host ports are configurable because ../adb/'s adb-free container
      # commonly occupies 1521/1522 on the same host — see .env.sample.
      - "${DB_HOST_PORT:-15216}:1521"
      - "${EM_EXPRESS_HOST_PORT:-5500}:5500"
    volumes:
      - ${DB_DATA_DIR:-./oradata}:/opt/oracle/oradata
      # Read-only access to the extracted APEX distribution so apexins.sql /
      # apex_rest_config.sql can be run via `docker exec` (needs the real
      # $ORACLE_HOME on the DB container, e.g. for apex_rest_config.sql's
      # catcon.pl shell-out — a thin host Instant Client doesn't have that).
      - ${APEX_INSTALL_DIR:-./apex-install}:/tmp/apex:ro
    # No explicit healthcheck: block here — plain Database Free/Enterprise
    # Edition images don't ship `healthcheck.sh` (that's an ADB-Free-only
    # script; confirmed empirically it's not on PATH here, which made any
    # override using it hang at "starting" forever even once the DB was
    # actually OPEN). This image already declares its own correct
    # HEALTHCHECK in its metadata (checkDBStatus.sh) — just inherit it.

  ords:
    # No official ords container image here: container-registry.oracle.com/database/ords
    # requires the same OTN registry login as the official DB images, which
    # this toolkit deliberately avoids (see .env.sample). Instead this runs
    # ORDS standalone from the zip distribution (setup-for-dbfree.sh's
    # download_ords(), a plain unauthenticated download.oracle.com URL)
    # inside a generic, unauthenticated JRE base image. ords-entrypoint.sh
    # (generated by run-dbfree.sh's write_ords_entrypoint(), bind-mounted
    # below) runs the non-interactive install + serve sequence. APEX itself
    # is installed separately, from the host, by run-dbfree.sh (apexins.sql /
    # apex_rest_config.sql) — this container only needs to serve it once
    # installed.
    image: ${ORDS_JAVA_IMAGE:-eclipse-temurin:21-jre-jammy}
    container_name: ${ORDS_CONTAINER_NAME:-caseweave-dbfree-ords}
    working_dir: /opt/ords
    entrypoint: ["/opt/ords-entrypoint.sh"]
    environment:
      - SYS_PASSWORD=${ORACLE_PWD}
      - ORDS_PUBLIC_USER_PASSWORD=${ORACLE_PWD}
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - DB_SERVICENAME=${ORACLE_PDB:-FREEPDB1}
    ports:
      - "${APEX_PORT:-8092}:8080"
    volumes:
      - ${ORDS_INSTALL_DIR:-./ords-install}:/opt/ords
      - ${ORDS_CONFIG_DIR:-./ords_config}:/etc/ords/config   # persists ORDS config + install marker across restarts
      - ${APEX_INSTALL_DIR:-./apex-install}:/opt/oracle/apex:ro
      - ./ords-entrypoint.sh:/opt/ords-entrypoint.sh:ro
    depends_on:
      oracle-db:
        condition: service_healthy
